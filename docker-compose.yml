services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neumscan}
      POSTGRES_USER: ${POSTGRES_USER:-neumscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neumscan_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      # This Compose file is the local deployment simulation and uses Django's
      # development server, so it must serve the collected static files.
      DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      # Place inceptionv3.h5 in ./static/model before using image analysis.
      - ./static/model:/app/static/model

volumes:
  postgres_data:
  media_data:
